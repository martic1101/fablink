services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fab
      POSTGRES_PASSWORD: fab
      POSTGRES_DB: fab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fab"]
      interval: 2s
      retries: 20

  simulator:
    build: .
    command: ["python", "-m", "simulator", "--host", "0.0.0.0", "--control-host", "0.0.0.0", "--speed", "3"]

  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fab:fab@db:5432/fab
      FAB_EQUIPMENT: ETCH01@simulator:5001,ETCH02@simulator:5002,CVD01@simulator:5003,CVD02@simulator:5004
      SIM_CONTROL_URL: http://simulator:8100
    depends_on:
      db:
        condition: service_healthy
      simulator:
        condition: service_started

  # ---- "split" profile: the cloud (Vercel) topology, runnable locally and in CI.
  #   docker compose --profile split up --build fab api-cloud
  # The fab daemon runs simulator + host; the stateless API talks to it via Redis.
  redis:
    image: redis:7-alpine
    profiles: ["split"]

  fab:
    build:
      context: backend
      dockerfile: Dockerfile.daemon
    profiles: ["split"]
    environment:
      # A provider-style URL on purpose: the app converts it for asyncpg.
      DATABASE_URL: postgres://fab:fab@db:5432/fab
      REDIS_URL: redis://redis:6379
      SIM_SPEED: "3"
      IDLE_PAUSE_SECONDS: ${IDLE_PAUSE_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  api-cloud:
    build: .
    profiles: ["split"]
    command: ["uvicorn", "app.vercel_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8001:8000"]
    environment:
      DATABASE_URL: postgres://fab:fab@db:5432/fab
      REDIS_URL: redis://redis:6379
    depends_on:
      - fab
