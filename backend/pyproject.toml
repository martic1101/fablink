[project]
name = "fablink"
version = "1.0.0"
description = "Equipment automation (SECS/GEM) and predictive maintenance platform"
requires-python = ">=3.9"
# Kept in step with requirements.txt; Vercel installs from this file.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
]

# The Vercel service "api" runs the stateless cloud app, not app/main.py (which
# runs the whole fab in-process for `make demo`).
[tool.vercel]
entrypoint = "app.vercel_api:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: spins up simulated tools and the full host"]
# The whole suite takes ~15 s; no single test should ever need this long.
timeout = 120
timeout_method = "thread"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008", "E741"]
